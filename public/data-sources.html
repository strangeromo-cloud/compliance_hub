<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="description" content="Compliance Hub public data source coverage and integration status">
  <title>Data Coverage · Compliance Hub</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="coverage-page">
  <a class="skip-link" href="#coverageMain">Skip to data coverage</a>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Compliance Hub home">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2 4.5 5.2v5.9c0 4.8 3.1 9.2 7.5 10.9 4.4-1.7 7.5-6.1 7.5-10.9V5.2L12 2Z"/><path d="m8.7 12 2.1 2.1 4.6-4.7"/></svg></span>
      <span><strong>Compliance Hub</strong><small id="brandSub">合规情报原型</small></span>
    </a>
    <div class="top-actions">
      <a class="settings-button coverage-back" href="/">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span id="backLabel">返回对话</span>
      </a>
      <div class="segmented" aria-label="Language">
        <button class="segmented-btn" id="coverageZh" type="button">中</button>
        <button class="segmented-btn" id="coverageEn" type="button">EN</button>
      </div>
      <button class="icon-button" id="coverageTheme" type="button" aria-label="切换明暗主题">
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.1A8.5 8.5 0 0 1 8.9 4a8.5 8.5 0 1 0 11.1 11.1Z"/></svg>
      </button>
    </div>
  </header>

  <main id="coverageMain" class="coverage-shell">
    <section class="coverage-hero" aria-labelledby="coverageTitle">
      <div>
        <p class="eyebrow">COMPLIANCE DATA LAYER</p>
        <h1 id="coverageTitle">公开数据覆盖与接入状态</h1>
        <p id="coverageLead">查看当前 Prototype 已经读取了什么、下一步可以自动化什么，以及哪些来源必须保留人工查询。</p>
      </div>
      <div class="coverage-date"><span id="checkedLabel">调研核验日期</span><strong id="checkedAt">—</strong></div>
    </section>

    <section class="coverage-summary" aria-label="Coverage summary">
      <article><span class="summary-icon live">✓</span><div><strong id="connectedCount">—</strong><span id="connectedLabel">当前有读取能力</span></div></article>
      <article><span class="summary-icon ready">↗</span><div><strong id="readyCount">—</strong><span id="readyLabel">现在可以开发</span></div></article>
      <article><span class="summary-icon limited">!</span><div><strong id="limitedCount">—</strong><span id="limitedLabel">有限制可开发</span></div></article>
      <article><span class="summary-icon manual">M</span><div><strong id="manualCount">—</strong><span id="manualLabel">仅人工查询</span></div></article>
    </section>

    <aside class="coverage-disclosure" role="note">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/></svg>
      <div><strong id="disclosureTitle">当前边界</strong><p id="disclosureText">—</p></div>
    </aside>

    <section class="coverage-controls" aria-label="Data source filters">
      <label class="coverage-search"><span class="sr-only">搜索数据源</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="sourceSearch" type="search" placeholder="搜索来源、机构或覆盖字段"></label>
      <div class="coverage-filters" role="group" aria-label="Module filter">
        <button type="button" class="filter-button active" data-module="all" aria-pressed="true">All</button>
        <button type="button" class="filter-button" data-module="trade" aria-pressed="false">Trade</button>
        <button type="button" class="filter-button" data-module="product" aria-pressed="false">Product</button>
        <button type="button" class="filter-button" data-module="tpdd" aria-pressed="false">TPDD</button>
      </div>
      <label class="coverage-select"><span id="feasibilityLabel">可行性</span><select id="feasibilitySelect"><option value="all">全部</option><option value="can_build_now">现在可开发</option><option value="can_build_with_limitations">有限制可开发</option><option value="manual_only">仅人工</option></select></label>
    </section>

    <div class="coverage-list-head"><div><h2 id="registryTitle">数据源注册表</h2><p id="registryHelp">“已读取”表示当前 Prototype 的真实能力，不等于已经建立完整历史数据库。</p></div><span id="visibleSourceCount" class="count-badge">0</span></div>
    <section id="sourceRegistry" class="registry-grid" aria-live="polite"></section>
    <div id="registryEmpty" class="registry-empty hidden">没有符合当前筛选条件的数据源。</div>
  </main>
  <script type="module" src="/data-sources.js"></script>
</body>
</html>
