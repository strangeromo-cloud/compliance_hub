<svg width="1220" height="1691" viewBox="0 0 1220 1691" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Compliance Hub 功能架构</title>
<desc>全系统只有一个主 Agent。数据层有三个消费者：取证与名单筛查、直接查询、以及专业 Agent 的取材；共用能力层不碰数据层，它读的是取证已经取到的事实。三条线之间的四个提问是「哪一步需要哪条线的答案」，不是运行时通信。</desc>
<style>
