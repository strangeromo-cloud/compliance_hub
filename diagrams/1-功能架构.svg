<g class="c-purple"><rect x="110" y="745" width="263" height="196" rx="4"/>
<text class="th" x="126" y="768">④ 贸易合规 Agent</text><text class="tn" x="126" y="787">范围：交易方是谁</text>
<text class="tn" x="126" y="812">① 确定法律实体　② 检索受限方名单</text><text class="tn" x="126" y="829">③ 名称匹配 中英跨语 · 用管辖　④ 身份要素消歧</text><text class="tn" x="126" y="846">⑤ 所有权穿透 · 四源合一张图算 50%</text><text class="tn" x="126" y="863">＋ 母公司筛查（依赖触发，不是固定步骤）</text>
<text class="tn" x="126" y="886">本线负责：交易方名单状态</text><text class="tn" x="126" y="903">§ 732.3(g) · OFAC 50% Rule</text><text class="tn" x="126" y="925">不读别的 Agent 的输出</text></g>

<g class="c-purple"><rect x="503" y="745" width="263" height="196" rx="4"/>
<text class="th" x="519" y="768">④ 产品出口管制 Agent</text><text class="tn" x="519" y="787">范围：物项本身受什么管</text>
<text class="tn" x="519" y="812">① 物项识别　② 是否受 EAR 管辖</text><text class="tn" x="519" y="829">③ 分类（ECCN）　④ 目的地与管制理由</text><text class="tn" x="519" y="846">⑤ 十项一般禁令　⑥ 许可例外</text>
<text class="tn" x="519" y="886">本线负责：物项管辖、物项分类</text><text class="tn" x="519" y="903">§ 734.3 · § 734.4 · Part 774</text><text class="tn" x="519" y="925">不读别的 Agent 的输出</text></g>

<g class="c-purple"><rect x="896" y="745" width="263" height="196" rx="4"/>
<text class="th" x="912" y="768">④ 第三方尽调 Agent</text><text class="tn" x="912" y="787">范围：中间人与付款安排</text>
<text class="tn" x="912" y="812">① 商业合理性　② 主体存续</text><text class="tn" x="912" y="829">③ 受益所有权　④ 付款路径</text><text class="tn" x="912" y="846">⑤ 持续监控</text>
<text class="tn" x="912" y="886">本线负责：付款路径风险信号</text><text class="tn" x="912" y="903">DOJ ECCP — Controls / Payment</text><text class="tn" x="912" y="925">不读别的 Agent 的输出</text></g>

<text class="cap" x="438" y="779" text-anchor="middle">贸易 ③ 名称匹配 问 →</text>
<text class="cap" x="438" y="793" text-anchor="middle">物项是否受 EAR 管辖</text>
<line class="arr-cap" x1="373" y1="805" x2="503" y2="805" marker-end="url(#ac)"/>
<text class="cap" x="438" y="865" text-anchor="middle">← 问 产品 ⑥ 许可例外</text>
<text class="cap" x="438" y="879" text-anchor="middle">交易方名单状态</text>
<line class="arr-cap" x1="503" y1="891" x2="373" y2="891" marker-end="url(#ac)"/>

<text class="cap" x="831" y="779" text-anchor="middle">产品 ⑤ 十项禁令 问 →</text>
<text class="cap" x="831" y="793" text-anchor="middle">付款路径风险信号</text>
<line class="arr-cap" x1="766" y1="805" x2="896" y2="805" marker-end="url(#ac)"/>
<text class="cap" x="831" y="865" text-anchor="middle">← 问 尽调 ① 商业合理性</text>
<text class="cap" x="831" y="879" text-anchor="middle">物项分类是否成立</text>
<line class="arr-cap" x1="896" y1="891" x2="766" y2="891" marker-end="url(#ac)"/>

<path class="arr" d="M241 941 V962" marker-end="url(#a)"/>
<path class="arr" d="M634 941 V962" marker-end="url(#a)"/>
<path class="arr" d="M1027 941 V962" marker-end="url(#a)"/>

<g class="c-purple"><rect x="110" y="962" width="1050" height="206" rx="4"/>
<text class="th" x="130" y="985">⑤ 结案条件 · 五条，分属三条线，所以没有任何一条线能独自定案</text>
<text class="ts" x="130" y="1007">1　名单筛查 —— 已筛过官方名单且零命中　§ 732.3(g)　贸易线</text>
<text class="ts" x="130" y="1025">2　物项分类 —— EAR99，或美国原产受控内容低于 de minimis　Part 774 · § 734.4　产品线</text>
<text class="ts" x="130" y="1043">3　最终目的地 —— 已声明，且在免许可目的地白名单内（19 国）　Part 738　产品线</text>
<text class="ts" x="130" y="1061">4　第三方参与 —— 明确说明是直接交易，无代理或经销　DOJ ECCP　尽调线</text>
<text class="ts" x="130" y="1079">5　最终用途 —— 已声明，且不落入 § 744 敏感用途　产品线 + 尽调线</text>
<text class="ts" x="130" y="1105">另有第六道闸：路径上不得留有任何未闭合步骤。五条全过但还有一步在等证据 → 依然不出清晰结论</text>
<text class="ts" x="130" y="1125">这五条会逐条显示给读者：满足 / 未满足、原因、负责的条线、满足的带条文出处；由代码算出，不依赖模型说了什么</text>
<text class="ts" x="130" y="1151">路径上还有<tspan font-weight="600">第四条线「结案」</tspan>，只有一步：Compliance / Legal 人工复核 —— 它不跑 Agent，也从不被自动关闭</text></g>

<path class="arr-loop" d="M110 1065 H78 V188 H110" marker-end="url(#al)"/>
<text class="lbl-loop" transform="rotate(-90 62 660)" x="62" y="660" text-anchor="middle">⑥ 结案条件算完后，回到同一个主 Agent 综合</text>

<path class="arr-loop" d="M110 212 H40 V1243 H110" marker-end="url(#al)"/>
<text class="lbl-loop" transform="rotate(-90 24 660)" x="24" y="660" text-anchor="middle">⑦ 综合后的答案，由同一个主 Agent 给出</text>

<g class="c-amber"><rect x="110" y="1198" width="1050" height="90" rx="5"/>
<text class="th" x="130" y="1221">答案</text>
<text class="ts" x="130" y="1241">沉默永远不算通过；本系统不做交易放行，人工复核那一步照常在</text>
<text class="ts" x="130" y="1259">含义是「在这些事实、这些条文下不产生许可要求」，不是「批准」</text>
<text class="ts" x="130" y="1277">带证据链、结论边界、未闭合步骤与人工复核要求；跨线结论注明是哪条线负责</text></g>

<path class="arr" d="M634 1288 V1318" marker-end="url(#a)"/>

<g class="c-teal"><rect x="110" y="1318" width="1050" height="120" rx="4"/>
<text class="th" x="130" y="1341">⑧ 历史记录与案件信号 · 一次运行结束时，和答案写在同一个事务里</text>
<text class="ts" x="130" y="1363">threads 92 条 · turns 161 条：完整案件历史，有条数上限，超出后按最近使用裁剪</text>
<text class="ts" x="130" y="1381">case_signals 49 条：每次运行一行，写在执行裁剪的同一个事务里，但被<tspan font-weight="600">刻意排除在裁剪之外</tspan></text>
<text class="ts" x="130" y="1399">信号记的是结构不是原文：意图 · 开了哪几条线 · 路由词有没有命中 · 结束时还缺哪一步 · 补了哪些字段 · 还剩几步未闭合</text>
<text class="ts" x="130" y="1421">历史能否活过重新部署取决于有没有挂 Volume —— 容器文件系统是临时的，页面会如实说明当前是哪种</text></g>

<path class="arr" d="M634 1438 V1468" marker-end="url(#a)"/>

<g class="c-gray"><rect x="110" y="1468" width="1050" height="180" rx="4"/>
<text class="th" x="130" y="1491">⑨ 靠这些信号进化 —— 两个方向，只有一个可以自动化</text>
<text class="ts" x="130" y="1513">四个指标（当前样本仅 49 条）：兜底率 2.1% · 打断率 79.6% · 每案轮次 2.1 · 结案时仍有未闭合步骤 40 次</text>
<text class="ts" x="130" y="1531">最常卡住的步骤：所有权穿透 14 · 身份消歧 14 · 物项识别 7　　被问了才补的字段：注册号 12 · 股权 2 · ECCN 1</text>
<text class="ts" x="130" y="1549">一个「被问了才补」的字段，就是输入框本可以一开始就问的字段 —— 这张表直接指出下一步该改哪里</text>
<text class="ts" x="130" y="1575">可以自动进化：路由词表 intent.js · Gem 的必需字段 · 匹配阈值（只许向召回放宽）· 同步频率 · 探针语料</text>
<text class="ts" x="130" y="1593">绝不：五个结案条件 · 触发门与其条文 · 跨线依赖边 · 任何能力的条文出处 ·「声明不等于已核验证据」</text>
<text class="ts" x="130" y="1611">右边每一项都指向一条法规。法规不会因为模型认为该改就改 —— 这条界线是这套系统唯一比通用助手强的地方</text>
<text class="ts" x="130" y="1633">产出是提案不是 commit：diff + 哪些案例为证 + 一个改前失败改后通过的测试 + 全套测试结果，由人合并</text></g>

