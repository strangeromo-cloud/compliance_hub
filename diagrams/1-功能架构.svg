  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  .arr-cap { stroke: #7A72C4; stroke-width: 1.5; fill: none; }
  .arr-data { stroke: #0F6E56; stroke-width: 1.5; fill: none; }
  .arr-loop { stroke: #854F0B; stroke-width: 1.8; fill: none; }
  .lbl-loop { font-size: 11.5px; font-weight: 500; fill: #854F0B; }
  .lbl-data { font-size: 10.5px; font-weight: 500; fill: #0F6E56; }
  .arr-evo { stroke: #6B6A64; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
  .lbl-evo { font-size: 11.5px; font-weight: 500; fill: #5F5E5A; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray .th { fill: #2C2C2A; } .c-gray .ts, .c-gray .tn { fill: #5F5E5A; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .c-purple .th { fill: #26215C; } .c-purple .ts, .c-purple .tn { fill: #534AB7; }
  .c-amber rect { fill: #FAEEDA; stroke: #854F0B; stroke-width: 1.2; }
  .c-amber .th { fill: #412402; } .c-amber .ts, .c-amber .tn { fill: #854F0B; }
  .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .c-teal .th { fill: #04342C; } .c-teal .ts, .c-teal .tn { fill: #0F6E56; }
</style>
