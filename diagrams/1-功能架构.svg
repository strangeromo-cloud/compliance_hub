<g class="c-amber"><rect x="110" y="140" width="845" height="95" rx="5"/>
<text class="th" x="130" y="166">主 Agent —— 全系统只有这一个</text>
<text class="ts" x="130" y="186">进来时判断这是什么问题并决定交给谁做；跑完后回到这里综合。两件事是同一个角色，不是两个 Agent</text>
<text class="ts" x="130" y="204">只做意图判断、调度与综合 —— 条文结论一律由专业 Agent 给出，它自己不下</text>
<text class="ts" x="130" y="222">输入框和后台读同一份规则、同一个结论；没有可用模型时直接拒答，不存在退回模板的模式</text></g>

<path class="arr" d="M211 235 V275" marker-end="url(#a)"/>
<path class="arr" d="M431 235 V275" marker-end="url(#a)"/>
<path class="arr" d="M651 235 V275" marker-end="url(#a)"/>
<path class="arr" d="M955 200 H970 V315 H985" marker-end="url(#a)"/>

<g class="c-purple"><rect x="110" y="275" width="202" height="80" rx="4"/><text class="th" x="124" y="297">合规审查</text><text class="tn" x="124" y="315">只开被选中的专业线</text><text class="tn" x="124" y="331">三条线同时发出，各一次</text><text class="tn" x="124" y="347">最多 4 次，两轮等待</text></g>
<g class="c-gray"><rect x="330" y="275" width="202" height="80" rx="4"/><text class="th" x="344" y="297">监管简报</text><text class="tn" x="344" y="315">读已同步公告排期</text><text class="tn" x="344" y="331">按生效日排序</text><text class="tn" x="344" y="347">0 次模型调用</text></g>
<g class="c-gray"><rect x="550" y="275" width="202" height="80" rx="4"/><text class="th" x="564" y="297">案件备忘录</text><text class="tn" x="564" y="315">整理本会话结论</text><text class="tn" x="564" y="331">不产生新判断</text><text class="tn" x="564" y="347">0 次模型调用</text></g>
<g class="c-gray"><rect x="985" y="275" width="175" height="80" rx="4"/><text class="th" x="999" y="297">直接查询</text><text class="tn" x="999" y="315">按料号或编码翻库</text><text class="tn" x="999" y="331">出记录，不出结论</text><text class="tn" x="999" y="347">0 次模型调用</text></g>

<path class="arr" d="M211 355 V395" marker-end="url(#a)"/>

<g class="c-gray"><rect x="110" y="395" width="590" height="150" rx="4"/>
<text class="th" x="130" y="420">① 取证与名单筛查 grounding · 每次审查开跑前做一次</text>
<text class="ts" x="130" y="444">向数据层检索已入库记录，加上用户当次声明的事实</text>
<text class="ts" x="130" y="462">配了官方 CSL 接口时，再实时查一次作为对照</text>
<text class="ts" x="130" y="480">合成一份共用事实：下面三条线读的是同一份，不各查各的</text>
<text class="ts" x="130" y="506">没有同步到的来源如实报告「本次未筛查」——</text>
<text class="ts" x="130" y="524">来源缺失不等于无风险，不会被写成「无命中」</text></g>

<g class="c-teal"><rect x="720" y="395" width="440" height="150" rx="4"/>
<text class="th" x="738" y="420">数据层 · 37 个官方来源 · 30 个已入库 · 106,287 条</text>
<text class="tn" x="738" y="439">单个 SQLite 文件，编排层只读；按条线分：贸易 16 · 产品 13 · 尽调 8</text>
<text class="tn" x="738" y="461">美国 16：BIS EAR / CCL / 国别矩阵 · OFAC SDN 与所有权图</text>
<text class="tn" x="738" y="478">　　　　CSL 综合筛查名单 · UFLPA · DoD 1260H · 联邦公报 · SEC 持股申报</text>
<text class="tn" x="738" y="495">中国 11：两用物项清单 · 许可目录 · 管控名单 · 不可靠实体 · 巨潮</text>
<text class="tn" x="738" y="512">其他 10：欧盟 · 英国 · 联合国 · 日本 · 台湾 · GLEIF · 厂商分类</text>
<text class="tn" x="738" y="534">32 个适配器（30 个可快照）；3 个有验证码的源没有适配器，明确只人工</text></g>

<path class="arr-data" d="M720 470 H700" marker-end="url(#ad)"/>
<text class="lbl-data" x="710" y="462" text-anchor="middle">读记录</text>
<path class="arr-data" d="M1072 395 V355" marker-end="url(#ad)"/>
<text class="lbl-data" x="1090" y="378">读记录</text>
<path class="arr-data" d="M900 545 V575" marker-end="url(#ad)"/>
<text class="lbl-data" x="918" y="566">取原文 · 存回正文与 ETag</text>

<path class="arr" d="M375 545 V575" marker-end="url(#a)"/>

<g class="c-gray"><rect x="110" y="575" width="530" height="125" rx="4"/>
<text class="th" x="128" y="598">② 共用能力层 agent-capabilities.js · 4 条具名能力</text>
<text class="tn" x="128" y="618">纯函数，0 次模型调用，也不碰数据层</text>
<text class="tn" x="128" y="635">它读的是 ① 已经取到的事实，不自己再查一次</text>
<text class="tn" x="128" y="652">在专业 Agent 开跑之前一次算完，同一份发给三条线</text>
<text class="tn" x="128" y="674">下面四个箭头是「哪一步需要哪条线的答案」，不是运行时的</text>
<text class="tn" x="128" y="691">消息：Agent 之间从不读对方的模型输出</text></g>

<g class="c-teal"><rect x="660" y="575" width="500" height="125" rx="4"/>
<text class="th" x="678" y="598">③ 取材 retrieval · 每条线只拿本线相关的官方条文</text>
<text class="tn" x="678" y="618">缓存未过期（默认 24 小时）→ 直接用，完全不出网</text>
<text class="tn" x="678" y="635">过期 → 带上次的 ETag 再问一次：304 就把原文原样写回，只刷新时间戳</text>
<text class="tn" x="678" y="652">200 → 存下新正文与新 ETag；请求失败 → 用旧版本，标注为过期</text>
<text class="tn" x="678" y="674">再失败 → 用存档记录标注为存档；都拿不到 → 标注「未取到」</text>
<text class="tn" x="678" y="691">绝不用注册表摘要冒充原文，那会让缺失看起来像证据</text></g>

<path class="arr" d="M375 700 V716"/>
<path class="arr" d="M910 700 V716"/>
