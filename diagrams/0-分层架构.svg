<svg width="1220" height="1250" viewBox="0 0 1220 1250" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Compliance Hub 分层架构</title>
<desc>两个入口：界面与服务给人用，MCP 给机器用，后者只到共用能力层。中间左右并排：主 Agent 与它的四种产出，以及合规审查内部的三个专业 Agent。底下是数据与来源，再底下是用户记忆与系统进化。</desc>
<style>
  svg { background: #ffffff; }
  text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", -apple-system, "Segoe UI", sans-serif; }
  .layer { font-size: 15px; font-weight: 600; }
  .sub { font-size: 12.5px; font-weight: 600; }
  .ts { font-size: 12px; font-weight: 400; }
  .tn { font-size: 11px; font-weight: 400; }
  .note { font-size: 12px; fill: #5F5E5A; }
  .side { font-size: 11px; fill: #888780; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  .arr-hand { stroke: #854F0B; stroke-width: 1.8; fill: none; }
  .arr-mcp { stroke: #5F5E5A; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  .lbl-hand { font-size: 11.5px; font-weight: 500; fill: #854F0B; }
  .band { fill: none; stroke-width: 1; stroke-dasharray: 5 4; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray .layer, .c-gray .sub { fill: #2C2C2A; } .c-gray .ts, .c-gray .tn { fill: #5F5E5A; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .c-purple .layer, .c-purple .sub { fill: #26215C; } .c-purple .ts, .c-purple .tn { fill: #534AB7; }
  .c-amber rect { fill: #FAEEDA; stroke: #854F0B; stroke-width: 1; }
  .c-amber .layer, .c-amber .sub { fill: #412402; } .c-amber .ts, .c-amber .tn { fill: #854F0B; }
  .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .c-teal .layer, .c-teal .sub { fill: #04342C; } .c-teal .ts, .c-teal .tn { fill: #0F6E56; }
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text class="side" x="40" y="34">Compliance Hub · 分层架构　　两个入口，一套内核。紫色是做判断的地方，琥珀色是主 Agent 与它的交接，其余是管道与数据。</text>

<text class="side" x="40" y="56">给人用</text>
<g class="c-gray"><rect x="40" y="64" width="830" height="116" rx="5"/>
<text class="layer" x="62" y="94">界面与服务</text>
<text class="ts" x="200" y="92">工作台 index.html · 数据覆盖 data-sources.html · 使用说明 guide.html</text>
<text class="ts" x="200" y="112">三份模块前后端共用，同一份规则不许有第二份拷贝：intent.js · gems.js · status-vocabulary.js</text>
<text class="ts" x="200" y="132">server.js · Node 24 · 第三方依赖 0 个 · 14 条路由 + 静态文件；合规审查走 NDJSON 流式，边跑边出</text>
<text class="ts" x="200" y="152">服务端配了模型 key 时完全忽略前端传来的 baseUrl —— 防止把密钥送到任意主机</text>
<text class="ts" x="200" y="172">浏览器直接跑，无构建步骤；没有可用模型时直接拒答</text></g>

<text class="side" x="890" y="56">给机器用</text>
<g class="c-gray"><rect x="890" y="64" width="290" height="116" rx="5"/>
<text class="sub" x="908" y="88">MCP · mcp-server.js</text>
<text class="tn" x="908" y="107">stdio JSON-RPC 2.0 · npm run mcp</text>
<text class="tn" x="908" y="124">发布右边那 4 条能力，工具名把点</text>
<text class="tn" x="908" y="141">换成双下划线；入参 schema 由能力</text>
<text class="tn" x="908" y="158">自己声明的 input 生成，不另写一份</text>
<text class="tn" x="908" y="175"><tspan font-weight="600">不暴露跑审查、存案件、碰模型的东西</tspan></text></g>

<path class="arr" d="M285 180 V246" marker-end="url(#a)"/>
<path class="arr-mcp" d="M1035 180 V196 H1196 V466 H1160" marker-end="url(#a)"/>
<text class="side" x="1100" y="192">只到能力层</text>

<rect class="band" x="40" y="210" width="490" height="638" rx="6" stroke="#C08A3E"/>
<text class="layer" x="60" y="231" fill="#854F0B">主 Agent 层</text>

<rect class="band" x="580" y="210" width="600" height="638" rx="6" stroke="#8B84D8"/>
<text class="layer" x="600" y="231" fill="#26215C">合规审查内部</text>

<g class="c-amber"><rect x="60" y="246" width="450" height="116" rx="4"/>
<text class="sub" x="78" y="270">主 Agent —— 全系统只有一个</text>
<text class="tn" x="78" y="291">判断意图与调度：<tspan font-weight="600">规则匹配，0 次模型</tspan>；综合：1 次模型调用</text>
<text class="tn" x="78" y="308">进出都是它，不是两个角色；条文结论一律由专业 Agent 给出</text>
<text class="tn" x="78" y="329">三种进入方式：直接描述交易 · / 选 Gem · @ 直查数据源</text>
<text class="tn" x="78" y="346">Gem 8 个：4 个审查 · 2 个直查 · 1 个简报 · 1 个备忘录，各自声明必需字段</text></g>

<path class="arr" d="M171 362 V386" marker-end="url(#a)"/>
<path class="arr" d="M403 362 V386" marker-end="url(#a)"/>

<g class="c-gray"><rect x="60" y="386" width="222" height="42" rx="4"/>
<text class="sub" x="74" y="405">监管简报</text><text class="tn" x="74" y="420">读已同步公告，按生效日排 · 0 次模型</text></g>
<g class="c-gray"><rect x="60" y="435" width="222" height="42" rx="4"/>
<text class="sub" x="74" y="454">案件备忘录</text><text class="tn" x="74" y="469">整理本会话已有结论 · 0 次模型</text></g>
<g class="c-gray"><rect x="60" y="484" width="222" height="42" rx="4"/>
<text class="sub" x="74" y="503">直接查询 @</text><text class="tn" x="74" y="518">按料号 / 编码 / 名单翻库 · 0 次模型</text></g>

<g class="c-purple"><rect x="296" y="386" width="214" height="140" rx="4"/>
<text class="sub" x="312" y="408">合规审查</text>
<text class="tn" x="312" y="429">只开被选中的专业线</text>
<text class="tn" x="312" y="446">每条线一次模型调用</text>
<text class="tn" x="312" y="463">一次审查最多 4 次</text>
<text class="tn" x="312" y="488">按路径顺序一条条跑，每条</text>
<text class="tn" x="312" y="505">前后各查一次要不要停下问</text></g>

<path class="arr-hand" d="M510 424 H556 V286 H600" marker-end="url(#ah)"/>
<text class="lbl-hand" transform="rotate(-90 536 486)" x="536" y="486" text-anchor="middle">① 判为合规审查，交出去</text>

<g class="c-purple"><rect x="600" y="246" width="560" height="112" rx="4"/>
<text class="sub" x="616" y="269">② 取材 retrieval ＋ 取证 grounding —— 两件不同的事，取材在前</text>
<text class="tn" x="616" y="290"><tspan font-weight="600">取材拿法条原文</tspan>：按条线挑官方文档（三条线全开时 14 份），24 小时缓存 + ETag 条件请求</text>
<text class="tn" x="616" y="307"><tspan font-weight="600">取证拿这笔交易的事实</tspan>：翻已入库的 106,287 条记录，加上用户当次声明</text>
<text class="tn" x="616" y="324">　产出：名单命中 · 筛了哪些源 · 哪些没同步 · 名称候选 · 所有权链 · 本次边界</text>
<text class="tn" x="616" y="346"><tspan font-weight="600">法条原文只发给下面三条线</tspan>；③④ 只看取证结果与用户声明，看不到原文</text></g>

<text class="tn" x="600" y="374" fill="#534AB7"><tspan font-weight="600">下面这两样都在三条线开跑之前一次算完</tspan>，都是规则、0 次模型，但去向不同：能力答案发给三条线，结案条件直接进综合</text>

<g class="c-purple"><rect x="600" y="382" width="265" height="168" rx="4"/>
<text class="sub" x="614" y="405">③ 结案条件 · 5 条</text>
<text class="tn" x="614" y="425">不进三条线，直接给主 Agent 综合</text>
<text class="tn" x="614" y="445">1 名单筛查 零命中　贸易线</text>
<text class="tn" x="614" y="462">2 物项分类 EAR99 / de minimis</text>
<text class="tn" x="614" y="479">3 最终目的地 在白名单内（19 国）</text>
<text class="tn" x="614" y="496">4 第三方 明确为直接交易　尽调线</text>
<text class="tn" x="614" y="513">5 最终用途 不落入 § 744</text>
<text class="tn" x="614" y="536">第六道闸：不得留有未闭合步骤</text></g>

<g class="c-purple"><rect x="885" y="382" width="275" height="168" rx="4"/>
<text class="sub" x="899" y="405">④ 共用能力层 · 4 条纯函数</text>
<text class="tn" x="899" y="425">发给下面每一条线，一份相同的答案</text>
<text class="tn" x="899" y="445">party_status　名单状态　贸易线负责</text>
<text class="tn" x="899" y="462">item_jurisdiction　管辖　产品线负责</text>
<text class="tn" x="899" y="479">classification_status　分类　产品线负责</text>
<text class="tn" x="899" y="496">payment_risk　付款风险　尽调线负责</text>
<text class="tn" x="899" y="519">每条带条文出处；三条线彼此不通信，</text>
<text class="tn" x="899" y="536">标「用 X」的步骤就是消费这里的答案</text></g>

<path class="arr" d="M1022 550 V562"/>
<path class="arr" d="M689 562 H1069"/>
<path class="arr" d="M689 562 V574" marker-end="url(#a)"/>
<path class="arr" d="M879 562 V574" marker-end="url(#a)"/>
<path class="arr" d="M1069 562 V574" marker-end="url(#a)"/>

<g class="c-purple"><rect x="600" y="574" width="178" height="156" rx="4"/>
<text class="sub" x="614" y="596">⑤ 贸易合规 Agent · 5 步</text>
<text class="tn" x="614" y="617">① 确定法律实体</text>
<text class="tn" x="614" y="634">② 检索受限方名单</text>
<text class="tn" x="614" y="651">③ 名称匹配 · 用管辖</text>
<text class="tn" x="614" y="668">④ 身份要素消歧</text>
<text class="tn" x="614" y="685">⑤ 所有权穿透 · 四源合一张图</text>
<text class="tn" x="614" y="706">＋ 母公司筛查（依赖触发）</text>
<text class="tn" x="614" y="723">负责：名单状态</text></g>

<g class="c-purple"><rect x="790" y="574" width="178" height="156" rx="4"/>
<text class="sub" x="804" y="596">⑤ 产品出口管制 Agent · 6 步</text>
<text class="tn" x="804" y="617">① 确定物项（型号）</text>
<text class="tn" x="804" y="634">② 是否受 EAR 管辖</text>
<text class="tn" x="804" y="651">③ 分类（ECCN）</text>
<text class="tn" x="804" y="668">④ 目的地与管制理由</text>
<text class="tn" x="804" y="685">⑤ 十项一般禁令 · 用付款</text>
<text class="tn" x="804" y="702">⑥ 许可例外 · 用名单</text>
<text class="tn" x="804" y="723">负责：管辖、分类</text></g>

<g class="c-purple"><rect x="980" y="574" width="180" height="156" rx="4"/>
<text class="sub" x="994" y="596">⑤ 第三方尽调 Agent · 5 步</text>
<text class="tn" x="994" y="617">① 商业合理性与费用 · 用分类</text>
<text class="tn" x="994" y="634">② 主体存续与注册信息</text>
<text class="tn" x="994" y="651">③ 受益所有权</text>
<text class="tn" x="994" y="668">④ 收款主体与付款路径</text>
<text class="tn" x="994" y="685">⑤ 持续监控与再评估</text>
<text class="tn" x="994" y="723">负责：付款风险</text></g>

<text class="tn" x="600" y="748" fill="#534AB7">三条线各拿到：<tspan font-weight="600">法条原文 ＋ 交易事实 ＋ 4 条能力答案</tspan>，各跑一次模型</text>
<text class="tn" x="600" y="765" fill="#534AB7">步骤与状态由代码算，Agent 不设置任何状态；缺证据就<tspan font-weight="600">停下问人</tspan>，填完从断点续跑</text>
<text class="tn" x="600" y="782" fill="#534AB7">路径上还有<tspan font-weight="600">第四条线「结案」</tspan>，一步：Compliance / Legal 人工复核，不跑 Agent</text>

<path class="arr" d="M689 730 V816"/>
<path class="arr" d="M879 730 V816"/>
<path class="arr" d="M1069 730 V816"/>
<path class="arr-hand" d="M1069 816 H510" marker-end="url(#ah)"/>
<text class="lbl-hand" x="520" y="808">⑥ 三条线的结果交回综合</text>

<path class="arr-hand" d="M600 504 H556 V624 H510" marker-end="url(#ah)"/>
<text class="lbl-hand" x="520" y="616">③ 直接进综合</text>

<path class="arr-hand" d="M60 324 H50 V700 H60" marker-end="url(#ah)"/>

<g class="c-amber"><rect x="60" y="550" width="450" height="280" rx="4"/>
<text class="sub" x="78" y="574">⑦ 答案 —— 由主 Agent 综合后给出</text>
<text class="tn" x="78" y="597">综合时只拿到两样：<tspan font-weight="600">三条线的结果 ＋ 五个结案条件</tspan></text>
<text class="tn" x="78" y="614">不得推翻专业线的结论；风险等级受结案条件约束</text>
<text class="tn" x="78" y="638">沉默永远不算通过；本系统不做交易放行，人工复核那一步照常在</text>
<text class="tn" x="78" y="655">含义是「在这些事实、这些条文下不产生许可要求」，不是「批准」</text>
<text class="tn" x="78" y="672">带证据链、结论边界、未闭合步骤与人工复核要求</text>
<text class="tn" x="78" y="696">五个结案条件逐条显示：满足 / 未满足、原因、负责的条线、条文出处</text>
<text class="tn" x="78" y="713">跨线结论注明是哪条线负责</text>
<text class="tn" x="78" y="737">同一个事务里写下：案件历史（给人看）＋ 案件信号（给进化用）</text>
<text class="tn" x="78" y="754">用户填的一律标注「声明，未核验」，不会变成已核验事实</text>
<text class="tn" x="78" y="778">结案条件、条文出处、依赖边这些指向法规的东西，永远不自动改</text>
<text class="tn" x="78" y="800">继续追问时，本会话最近 6 轮连同问题一起发给模型</text></g>

<path class="arr" d="M285 848 V880" marker-end="url(#a)"/>
<path class="arr" d="M880 848 V880" marker-end="url(#a)"/>
<text class="tn" x="298" y="870" fill="#0F6E56">直查读记录</text>
<text class="tn" x="893" y="870" fill="#0F6E56">取证读记录、取材读原文</text>

<g class="c-teal"><rect x="40" y="880" width="1140" height="112" rx="5"/>
<text class="layer" x="62" y="912">数据与来源</text>
<text class="ts" x="210" y="910">37 个官方来源：美国 16 · 中国 11 · 其他 10（欧盟 / 英国 / 联合国 / 日本 / 台湾 / GLEIF / 厂商分类）</text>
<text class="ts" x="210" y="930">32 个适配器（30 个可快照）：手动触发 · 启动时 · 定时；取原文 → 解析归一 → 一次事务写入并记 SHA-256</text>
<text class="ts" x="210" y="950">3 个有验证码的源没有适配器，明确只人工 —— 不绕验证码，缺了就说缺了</text>
<text class="ts" x="210" y="970">落到单个 SQLite 文件 · 9 张表 · 106,287 条记录：名单记录 · 原始快照 · 页面缓存 · 案件历史 · 案件信号</text></g>

<path class="arr" d="M300 992 V1024" marker-end="url(#a)"/>
<path class="arr" d="M880 992 V1024" marker-end="url(#a)"/>

<g class="c-teal"><rect x="40" y="1024" width="560" height="152" rx="5"/>
<text class="sub" x="60" y="1048">用户记忆 · 案件历史　threads · turns</text>
<text class="tn" x="60" y="1069">会话内：最近 6 轮对话随问题一起发给模型（专业线与综合各一份）</text>
<text class="tn" x="60" y="1086">跨会话：threads 上限 100 个，每个 thread 的 turns 上限 30 条，超出按最近使用裁剪</text>
<text class="tn" x="60" y="1108">重开一个案件时，恢复的是 threadId 与已声明的事实，<tspan font-weight="600">对话不恢复</tspan></text>
<text class="tn" x="60" y="1125">　模型看不到上次的措辞，只看到这次的事实 —— 旧表述带不偏新结论</text>
<text class="tn" x="60" y="1147">声明的事实一路累积；停下问人、填完从断点续跑走的就是这条</text>
<text class="tn" x="60" y="1164">历史能否活过重新部署，取决于有没有挂 Volume；页面会如实说明当前是哪种</text></g>

<g class="c-gray"><rect x="620" y="1024" width="560" height="152" rx="5"/>
<text class="sub" x="640" y="1048">系统进化 · case_signals → /api/evolution</text>
<text class="tn" x="640" y="1069">每次运行写一行信号，和裁剪写在<tspan font-weight="600">同一个事务</tspan>里，但被<tspan font-weight="600">刻意排除在裁剪之外</tspan></text>
<text class="tn" x="640" y="1086">记的是结构不是原文：意图 · 开了哪几条线 · 路由词有没有命中 · 停在哪一步 · 补了哪些字段</text>
<text class="tn" x="640" y="1108">四个指标：兜底率 · 打断率 · 每案轮次 · 结案时仍有未闭合步骤；展示在数据覆盖页</text>
<text class="tn" x="640" y="1125">两张表指出下一步改哪里：最常卡住的步骤 · 被问了才补的字段</text>
<text class="tn" x="640" y="1147">可自动进化：<tspan font-weight="600">路由词表 intent.js</tspan>（最上面那一层）· Gem 必需字段 · 匹配阈值（只许放宽召回）· 同步频率</text>
<text class="tn" x="640" y="1164">绝不：结案条件 · 触发门与条文 · 依赖边 · 能力的条文出处。<tspan font-weight="600">只产出提案，由人合并</tspan></text></g>

<text class="note" x="40" y="1208">一次合规审查最多 <tspan font-weight="600">4 次</tspan>模型调用：三条专业 Agent 各一次，主 Agent 综合一次。简报、备忘录、直查、MCP 都是 0 次。</text>
<text class="note" x="40" y="1230">规则匹配全在代码里（意图路由 · 名称比对 · 名单筛查 · 触发门 · 步骤状态 · 4 条能力 · 5 个结案条件）；模型只用来写分析与综合。</text>
</svg>
